<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Wayfarer Email Template Library</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
  h1 { color: #1a1a2e; text-align: center; margin-bottom: 5px; }
  p.sub { text-align: center; color: #666; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
  .card-header { background: #1a1a2e; color: #fff; padding: 15px 20px; }
  .card-header h3 { margin: 0; font-size: 15px; }
  .card-header span { font-size: 12px; color: #a0a8c0; }
  .card-body { padding: 15px 20px; }
  .preview { width: 100%; height: 120px; border: 1px solid #eee; border-radius: 6px; overflow: hidden; background: #fafafa; cursor: pointer; }
  .preview iframe { width: 100%; height: 100%; border: none; pointer-events: none; transform: scale(0.5); transform-origin: top left; width: 200%; height: 200%; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-copy { background: #1a1a2e; color: #fff; }
  .btn-copy:hover { background: #2d2d4e; }
  .btn-preview { background: #f0f2f5; color: #1a1a2e; }
  .btn-preview:hover { background: #e0e2e5; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #27ae60; color: #fff; padding: 12px 28px; border-radius: 30px; font-weight: 600; display: none; z-index: 999; }
  .modal { display: none; position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
  .modal-inner { background: #fff; border-radius: 12px; width: 90%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-header { background: #1a1a2e; color: #fff; padding: 15px 20px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
  .modal-body { flex: 1; overflow: auto; }
  .modal-body iframe { width: 100%; height: 600px; border: none; }
</style>
</head>
<body>

<h1>📧 Wayfarer Email Template Library</h1>
<p class="sub">Click any template to copy its HTML and paste directly into Netcore</p>

<div class="grid" id="templateGrid">
  <!-- Templates are listed below — add new ones each day -->
</div>

<div class="toast" id="toast">✅ HTML Copied to Clipboard!</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-header">
      <span id="modalTitle">Template Preview</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <iframe id="modalFrame"></iframe>
    </div>
  </div>
</div>

<script>
// ============================================================
// TEMPLATE LIBRARY — Add new templates here each day
// Format: { title, date, file }
// ============================================================
var templates = [
  {
    title: "Top 5 World News – June 5, 2026",
    date: "5 June 2026",
    file: "daily_email_June5_2026.html"
  },
  {
    title: "Moon's Origin Story",
    date: "8 June 2026",
    file: "moons_origin_story.html"
  }
  // Add more templates here as you go:
  // { title: "Top 5 News – June 6, 2026", date: "6 June 2026", file: "daily_email_June6_2026.html" },
];

// ============================================================
function buildGrid() {
  var grid = document.getElementById('templateGrid');
  if (templates.length === 0) {
    grid.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1">No templates yet. Add HTML files and update the list above.</p>';
    return;
  }
  templates.forEach(function(t, i) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <h3>${t.title}</h3>
        <span>📅 ${t.date}</span>
      </div>
      <div class="card-body">
        <div class="preview">
          <iframe src="${t.file}" sandbox="allow-same-origin"></iframe>
        </div>
        <div class="btn-row">
          <button class="btn btn-copy" onclick="copyTemplate('${t.file}', '${t.title}')">📋 Copy HTML</button>
          <button class="btn btn-preview" onclick="previewTemplate('${t.file}', '${t.title}')">👁 Preview</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function copyTemplate(file, title) {
  fetch(file)
    .then(r => r.text())
    .then(html => {
      navigator.clipboard.writeText(html).then(() => {
        var toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
      });
    })
    .catch(() => alert('Could not load file: ' + file + '\nMake sure it is in the same folder as this page.'));
}

function previewTemplate(file, title) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalFrame').src = file;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('modalFrame').src = '';
}

buildGrid();
</script>
</body>
</html>
